<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock paper scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="visible-frame">
        <div class="score-board">
            <h3>Computer score : <span id="computer-score">0</span></h3>
            <h3>User score : <span id="user-score">0</span></h3>
        </div>
        <button id="reset">Reset</button>
        <div class="game-output">
            <h2>Computer Choice : <span id="computer-choice"></span></h2>
            <h2>Users Choice : <span id="user-choice"></span></h2>
            <h2>Result : <span id="result"></span></h2>
        </div>
            <button id="Rock" class="btn">Rock</button>
            <button id="Paper" class="btn">Paper</button>
            <button id="Scissors" class="btn">Scissors</button>
    </div>
  
    <script  src="script.js"></script>
</body>
</html>
